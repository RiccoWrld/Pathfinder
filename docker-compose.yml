services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pathfinder
      POSTGRES_USER: pathfinder
      POSTGRES_PASSWORD: pathfinder_password
    ports:
      - "5440:5432"
    volumes:
      - pathfinder-db-data:/var/lib/postgresql/data
      - ./setup.sql:/docker-entrypoint-initdb.d/001-setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathfinder -d pathfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://pathfinder:pathfinder_password@db:5432/pathfinder
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-change_this_for_real_use}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - server

volumes:
  pathfinder-db-data:
